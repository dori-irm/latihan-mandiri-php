<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Daftar Mahasiswa</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        table { border-collapse: collapse; width: 50%; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>
    <h2>Daftar Nilai Mahasiswa</h2>
    
    <table>
        <thead>
            <tr>
                <th>No</th>
                <th>NIM</th>
                <th>Nama</th>
                <th>Nilai</th>
            </tr>
        </thead>
        <tbody id="tabelMahasiswa">
            <!-- Data akan dimuat lewat JavaScript -->
        </tbody>
        <tfoot>
            <tr>
                <th colspan="3">Rata-Rata Nilai</th>
                <th id="rataRata">0</th>
            </tr>
        </tfoot>
    </table>

    <script>
        const mahasiswa = [
            { nim: "2024001", nama: "Budi Santoso", nilai: 85 },
            { nim: "2024002", nama: "Siti Aminah", nilai: 78 },
            { nim: "2024003", nama: "Rudi Hermawan", nilai: 65 },
            { nim: "2024004", nama: "Dewi Lestari", nilai: 90 },
            { nim: "2024005", nama: "Ahmad Fauzi", nilai: 55 },
        ];

        let tbody = document.getElementById('tabelMahasiswa');
        let totalNilai = 0;
        let html = '';

        mahasiswa.forEach((mhs, index) => {
            totalNilai += mhs.nilai;
            html += `<tr>
                <td>${index + 1}</td>
                <td>${mhs.nim}</td>
                <td>${mhs.nama}</td>
                <td>${mhs.nilai}</td>
            </tr>`;
        });

        tbody.innerHTML = html;

        let rataRata = totalNilai / mahasiswa.length;
        document.getElementById('rataRata').innerText = rataRata.toFixed(2);
    </script>
</body>
</html>
