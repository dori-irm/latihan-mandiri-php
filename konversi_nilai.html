<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Uji Fungsi Konversi Nilai</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        ul { line-height: 1.6; }
    </style>
</head>
<body>

    <h2>Uji Fungsi Konversi Nilai</h2>
    <ul id="hasilKonversi">
        <!-- Hasil pengujian akan dimasukkan lewat JavaScript -->
    </ul>

    <script>
        // Fungsi konversi nilai (pengganti fungsi PHP)
        function konversiNilai(nilai) {
            if (nilai >= 81 && nilai <= 100) {
                return "A";
            } else if (nilai >= 76 && nilai <= 80) {
                return "B";
            } else if (nilai >= 61 && nilai <= 75) {
                return "C";
            } else if (nilai >= 36 && nilai <= 60) {
                return "D";
            } else if (nilai >= 0 && nilai <= 35) {
                return "E";
            } else {
                return "Nilai Tidak Valid";
            }
        }

        // Contoh Pengujian Fungsi
        const contohNilai = [85, 78, 65, 45, 20];
        let daftarHTML = "";

        contohNilai.forEach(n => {
            let hurufMutu = konversiNilai(n);
            daftarHTML += `<li>Nilai <strong>${n}</strong> mendapat Huruf Mutu: <strong>${hurufMutu}</strong></li>`;
        });

        // Menampilkan hasil ke dalam elemen HTML
        document.getElementById('hasilKonversi').innerHTML = daftarHTML;
    </script>

</body>
</html>
