<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Kalkulator Sederhana</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .result { margin-top: 15px; font-weight: bold; }
        .error { color: red; }
    </style>
</head>
<body>
    <h2>Kalkulator</h2>
    
    <input type="number" id="angka1" placeholder="Angka Pertama" step="any">
    <select id="operator">
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">*</option>
        <option value="/">/</option>
    </select>
    <input type="number" id="angka2" placeholder="Angka Kedua" step="any">
    <button onclick="hitung()">Hitung</button>

    <div class="result" id="hasilOutput"></div>

    <script>
        function hitung() {
            let a1 = parseFloat(document.getElementById('angka1').value);
            let a2 = parseFloat(document.getElementById('angka2').value);
            let op = document.getElementById('operator').value;
            let output = document.getElementById('hasilOutput');
            let hasil = 0;

            if (isNaN(a1) || isNaN(a2)) {
                output.innerHTML = "<span class='error'>Harap masukkan angka dengan benar!</span>";
                return;
            }

            switch (op) {
                case '+': hasil = a1 + a2; break;
                case '-': hasil = a1 - a2; break;
                case '*': hasil = a1 * a2; break;
                case '/':
                    if (a2 === 0) {
                        output.innerHTML = "<span class='error'>Kesalahan: Tidak dapat melakukan pembagian dengan angka 0!</span>";
                        return;
                    }
                    hasil = a1 / a2;
                    break;
            }

            output.innerHTML = `Hasil: ${a1} ${op} ${a2} = <strong>${hasil}</strong>`;
        }
    </script>
</body>
</html>
